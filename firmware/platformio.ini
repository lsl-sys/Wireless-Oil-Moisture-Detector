; ============================================================================
; 油液微水监测系统 — 单板固件工程（采集端）
; ----------------------------------------------------------------------------
;   oil_device : 采集端（ESP32-C5）— RS485 读 MDS-680A → WiFi/TCP 发送
;                直连电脑所在网络，上位机通过网络取数据（无接收端板子）
;
; 平台：pioarduino 社区版（arduino-esp32 3.3.x / ESP-IDF 5.5.x）
;       支持 ESP32-C5 的 WiFi 5G（esp_wifi_set_band_mode）
; ============================================================================

[platformio]
default_envs = oil_device
; 工程路径含中文，构建中间产物放 ASCII 短路径规避链接器路径问题
; 同时 PlatformIO 核心目录已迁到 D:\pio（规避 Windows 260 字符长路径限制；2026-10-24 从 C:\pio 迁来）
build_dir = D:/pio/builds/oilmoist

[env]
framework = arduino
monitor_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wno-unused-function

; ----------------------------------------------------------------------------
; 采集端：RS485 → WiFi/TCP
; ----------------------------------------------------------------------------
[env:oil_device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; 已切换到双 OTA 分区表：ota0/ota1 各 1.25MB，littlefs 1.44MB
; 固件侧启用 HTTP Update Server，支持上位机 OTA 升级
board_build.partitions = ota_4MB.csv
build_flags =
    ${env.build_flags}
    ; 日志固定走 UART0（板载 CH343 → COM6 @921600），禁用 USB CDC 日志，
    ; 规避 HWCDC 在主机插拔 CDC 口时 write 阻塞拖死主循环的风险
    -DARDUINO_USB_CDC_ON_BOOT=0
; 预编译库(5.5.5+b774170)的 esp32c5/pioarduino-build.py 无条件注入 --wrap=log_printf，
; 而平台只在 custom_sdkconfig 路径下才剥离它，导致无自定义 sdkconfig 的本工程链接时
; 找不到 __wrap_log_printf 定义。此处显式摘除该链接标志（日志包壳功能本工程不用）。
build_unflags =
    -Wl,--wrap=log_printf
upload_speed = 921600
